<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイネージ配置管理（サンプル）</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#6b7385;--line:#e2e5eb;--acc:#2f6fde;--island:#fafbfc;--islandLine:#9aa3b2}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700}
#store{border:1px solid transparent;border-radius:6px;padding:4px 8px;font:inherit;font-size:14px;color:var(--sub);width:200px;background:transparent}
#store:hover,#store:focus{border-color:var(--line);background:#fff;outline:none}
.sp{flex:1}
.sample{font-size:11px;background:#fff6e0;color:#8a5a00;border:1px solid #f1d9a0;border-radius:12px;padding:2px 9px}
.filebtn{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}.filebtn:hover{background:#f0f2f6}
#saveState{font-size:12px;color:var(--sub)}
#saveState.dirty{color:#c4471f;font-weight:500}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{background:#f0f2f6}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{background:#255bc0}
button:disabled{opacity:.45;cursor:default}
button.on{background:#1d2330;color:#fff;border-color:#1d2330}
#tabs{display:flex;align-items:flex-end;gap:4px;padding:12px 20px 0;max-width:1500px;margin:0 auto;flex-wrap:wrap;border-bottom:1px solid var(--line)}
button.tab{border-radius:9px 9px 0 0;border-bottom:none;padding:8px 18px;font-size:14px;background:#e9ecf1;color:var(--sub);margin-bottom:-1px}
button.tab.cur{background:var(--bg);color:var(--ink);font-weight:700;border-color:var(--line);box-shadow:inset 0 3px 0 var(--acc)}
button.tab.add{background:transparent;border:1px dashed var(--line);border-radius:9px;color:var(--acc);margin-bottom:6px;padding:5px 12px;font-size:13px}
#tabName{font:inherit;font-size:14px;padding:7px 10px;border:2px solid var(--acc);border-radius:9px 9px 0 0;width:150px;outline:none}
.tabact{display:flex;gap:6px;padding-bottom:6px}.tabact button{font-size:12px;padding:5px 10px}
.ptag{display:inline-block;font-size:11px;background:#eaf1fd;color:#22509f;border-radius:10px;padding:0 7px;margin:0 2px}
main{display:grid;align-items:start;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
#mapCard{padding:10px;position:relative}
#mapTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 4px 8px}
#mapTools .hint{font-size:12px;color:var(--sub)}
svg#map{width:100%;height:auto;display:block;max-height:calc(100vh - 150px);touch-action:none}
.isl{fill:var(--island);stroke:var(--islandLine);stroke-width:2}
.mid{stroke:var(--islandLine);stroke-width:1.2}
.aisle{font-size:26px;fill:#b3b9c4;text-anchor:middle;dominant-baseline:middle;font-weight:500}
.lbl{font-size:20px;fill:var(--sub);text-anchor:middle;dominant-baseline:middle}
.wall{stroke:#5b6475;stroke-width:3;fill:none}path.wall{fill:#f7f8fa}.area{fill:#3b4352;font-weight:500}
.zone{font-size:22px;fill:#9aa3b2;font-weight:700;letter-spacing:.1em}
.pin rect.bd{stroke:#fff;stroke-width:2.5;cursor:pointer}.pin rect.sg{stroke:none;cursor:pointer}
.pin.cm text{paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:4px}.pin.cm.empty text{fill:#6b7385;stroke:none}
.cmode{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}.cmode span{font-size:12px;color:var(--sub);padding:0 8px}
.cmode button{border:none;border-left:1px solid var(--line);border-radius:0;padding:6px 12px}.cmode button.on{background:#1d2330;color:#fff}
#legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 8px;align-items:center}
button.lg{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:14px}button.lg b{color:var(--sub);font-weight:500}
button.lg.on{background:#eef1f6;color:var(--ink);border-color:#1d2330;box-shadow:0 0 0 1px #1d2330 inset}button.lg.clr{color:var(--acc)}.lgh{font-size:11px;color:var(--sub)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.pin text{font-size:20px;fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.dim{opacity:.18}
.pin.ex rect.bd{stroke:#1d2330;stroke-width:3.5;stroke-dasharray:7 4}
.exsw{display:inline-block;width:14px;height:11px;border:2px dashed #1d2330;border-radius:3px;flex:none}
.exb{font-size:10px;border:1px dashed #1d2330;border-radius:8px;padding:0 5px;margin-left:3px;color:#1d2330;white-space:nowrap}
#exLegend{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:2}
.pin.sel rect.bd{stroke:#1d2330;stroke-width:5}
.edit .pin rect{cursor:move!important}
.adding svg#map{cursor:crosshair}
svg#map.zoomed{cursor:grab}svg#map.panning{cursor:grabbing}
#zoomBar{position:absolute;right:16px;top:96px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(20,24,33,.08);z-index:2}
#zoomBar button{padding:5px 10px;font-size:13px;min-width:34px}#zoomBar #zIn,#zoomBar #zOut{font-size:16px;font-weight:700;padding:3px 10px}
#zl{font-size:12px;color:var(--sub);min-width:42px;text-align:center}
#mapCard:fullscreen{background:#fff;padding:14px;overflow:auto}#mapCard:fullscreen svg#map{max-height:calc(100vh - 80px)}
#tip{position:absolute;pointer-events:none;background:#1d2330;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;display:none;white-space:nowrap;z-index:3}
aside{display:flex;flex-direction:column;gap:16px}
.sec{padding:14px 16px}
.sec h2{font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:500}
#counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cnt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;user-select:none}
.cnt .n{font-size:20px;font-weight:700;line-height:1.2}
.cnt .k{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.cnt.off{opacity:.35}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.cnt.total{background:#f7f8fa;cursor:default}
.cnt.wide{grid-column:span 3;display:flex;align-items:center;justify-content:space-between;padding:7px 10px}
.cnt.wide .n{font-size:17px}.cnt.wide small{font-size:12px;font-weight:400;color:var(--sub)}
.cnt.wide.on{border-color:#d6453d;background:#fdf1f0}.cnt.info{cursor:default;background:#f7f8fa}
.pin circle.late{fill:#d6453d;stroke:#fff;stroke-width:3;pointer-events:none}
.cbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fafbfc}
.chead{display:flex;gap:6px;align-items:center}.chead b{width:18px;text-align:center;color:var(--sub)}
.chead input{flex:1}
button.x{padding:4px 9px;color:var(--sub)}
.cgrid{display:grid;grid-template-columns:1fr 1.2fr auto;gap:6px;margin-top:6px}
.cgrid select,.cgrid input{font:inherit;font-size:13px!important;border:1px solid var(--line);border-radius:7px;padding:6px 6px!important;background:#fff;min-width:0}
.cgrid button{font-size:12px;padding:5px 8px;white-space:nowrap}
.cstate{font-size:12px;color:var(--sub);margin-top:5px;min-height:16px}
.pre{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px}.pre span{font-size:12px;color:var(--sub);margin-right:2px}
button.chip{font-size:12px;padding:4px 10px;border-radius:14px;background:#eef3fd;border-color:#cfdcf7;color:#22509f}
button.chip:hover{background:#e0eafb}button.chip:disabled{background:#f3f4f6;border-color:var(--line);color:#a0a6b2}
button.chip.edit{background:#fff;border-style:dashed;color:var(--sub)}
.addc{width:100%;border-style:dashed;color:var(--acc)}
.limit{font-size:12px;color:var(--sub);text-align:center;padding:8px;border:1px dashed var(--line);border-radius:8px}
.st{font-size:11px;padding:1px 6px;border-radius:10px;white-space:nowrap}
.st.late{background:#fde5e3;color:#b8322b;font-weight:700}.st.ok{background:#e7f4ec;color:#23794a}.st.none{background:#f0f1f4;color:var(--sub)}
.fset{grid-column:span 3;font-size:12px;color:var(--sub);padding:4px 2px 0}.fset input{width:48px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;margin:0 2px}
.fq.fh{background:#fff3e6;border-color:#f3cfa5;color:#a35a00}.fq.fl{background:#f3f4f6}
.fq{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:0 6px;white-space:nowrap}
.cl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:1px 0}
td.cn{color:var(--sub);white-space:nowrap}
#form .row{margin-bottom:10px}
#form label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
#form input:not(.cgrid input),#form textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink)}
#form input:focus,#form textarea:focus{outline:2px solid #c9d8f7;border-color:var(--acc)}
#form textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:5px}
.seg button.cur{border-color:var(--ink);font-weight:700}
#formHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#formHead .big{font-size:20px;font-weight:700}
.empty{color:var(--sub);font-size:13px;line-height:1.7}
button.danger{color:#c43a32}
#tableCard{grid-column:1/-1;padding:0;overflow:hidden}
#tableHead{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tableHead h2{font-size:14px;margin:0}
#q{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;width:220px}
.tw{overflow:auto;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#f7f8fa;text-align:left;font-weight:500;color:var(--sub);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #eef0f3;vertical-align:top}
tr{cursor:pointer}
tbody tr:hover{background:#f7f9fd}
tr.sel{background:#eaf1fd}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(20,24,33,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:12px;padding:18px 20px;width:min(640px,100%);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 8px;font-size:16px}
.mbox p{font-size:13px;color:var(--sub);margin:0 0 10px;line-height:1.7}
.mbox textarea{width:100%;min-height:220px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:none;z-index:30}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px}header{padding:10px 12px}#store{width:140px}}

  const d=txt.includes('\t')?'\t':',';const rows=[];let row=[],f='',inq=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(inq){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c==='"'&&f==='')inq=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''))}
function importText(txt){
  const rows=parse(txt.replace(/^﻿/,''));if(rows.length<2)return '見出し行とデータ行が見つかりませんでした';
  const head=rows[0].map(h=>h.trim());const idx={};COLS.forEach(([k,l])=>{const i=head.indexOf(l);if(i>=0)idx[k]=i});
  if(idx.id==null)return '「ID」列が見つかりませんでした';
  let up=0,ad=0;const seen=new Set();
  rows.slice(1).forEach(r=>{const id=(r[idx.id]||'').trim();if(!id)return;let it=S.items.find(i=>i.id===id);
    let pid=plan;if(idx.tab!=null){const nm=(r[idx.tab]||'').trim();if(nm){let p=S.plans.find(x=>x.name===nm);if(!p){p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:nm};S.plans.push(p)}pid=p.id}}
    if(!it){it={id,area:'',loc:'',x:120,y:120,w:40,h:36,status:'予定',size:'',group:'',contents:[],cplan:{},date:'',note:''};S.items.push(it);ad++}else if(!seen.has(id))up++;seen.add(id);
    if([1,2,3].some(n=>idx['c'+n+'t']!=null)){const cs=[];for(let n=1;n<=MAXC;n++){const g=k=>idx['c'+n+k]!=null?(r[idx['c'+n+k]]||'').trim():'';
      const c={t:g('t'),f:FREQ.some(x=>x.k===g('f'))?g('f'):'',l:/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(g('l'))?g('l').replace(/\//g,'-').replace(/-(\d)(?=-|$)/g,'-0$1'):''};if(c.t||c.f||c.l)cs.push(c)}it.cplan[pid]=cs}
    COLS.forEach(([k])=>{if(k==='id'||k==='tab'||/^c\d/.test(k)||idx[k]==null)return;let v=(r[idx[k]]||'').trim();
      if(k==='x'||k==='y'){const n=parseFloat(v);if(!isNaN(n))it[k]=n;return}
      if(k==='status'&&!STATUS.some(s=>s.k===v))v=it.status;
      if(k==='kind'&&v!=='既存')v='新設';it[k]=v})});
  bindPlan();setDirty(true);all();return `${up}件を更新、${ad}件を追加しました`}

async function save(){
  if(!dirty)return;const d=new Date();S.updatedAt=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  try{localStorage.setItem(LSK,JSON.stringify(S,(k,v)=>k==='contents'?undefined:v));setDirty(false);toast('このブラウザに保存しました')}
  catch(e){toast('保存できませんでした（ブラウザの設定を確認してください）')}}
function dlFile(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const stamp=()=>new Date().toISOString().slice(0,10);

shell();bind();document.querySelectorAll('.cmode [data-cm]').forEach(x=>x.classList.toggle('on',x.dataset.cm===cmode));all();setDirty(false);
art={};setDirty(false);$('#bCsv').style.display='';
$('#bJsonOut').addEventListener('click',()=>dlFile('signage_data_'+stamp()+'.json',JSON.stringify(S,(k,v)=>k==='contents'?undefined:v,1),'application/json'));
$('#jsonIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;
  localStorage.setItem(LSK,JSON.stringify(d));location.reload()}catch(err){toast('データファイルを読み込めませんでした')}};r.readAsText(f)});
$('#bReset').addEventListener('click',e=>{const b=e.target;if(!b.dataset.c){b.dataset.c='1';b.textContent='本当に初期状態に戻す';return}try{localStorage.removeItem(LSK)}catch(err){}location.reload()});
})();
